name: Refresh market data

# Runs every morning and writes an updated data.json.
# You can also trigger it by hand from the Actions tab (Run workflow).
on:
  schedule:
    # 11:30 UTC ≈ 7:30 AM US Eastern (daylight) / 6:30 AM Central.
    # GitHub cron is always UTC. Adjust the time here if you like.
    - cron: "30 11 * * 1-6"     # Mon–Sat (Sat catches Fri's close)
  workflow_dispatch: {}          # manual "Run workflow" button

# Let the job commit the refreshed data.json back to the repo.
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data.json
        run: python refresh.py

      - name: Commit updated data
        run: |
          git config user.name  "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No change in data.json — nothing to commit."
          else
            git add data.json
            git commit -m "Auto-refresh market data ($(date -u +%Y-%m-%d))"
            git push
          fi
